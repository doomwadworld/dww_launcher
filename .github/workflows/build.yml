name: Build

# Tests on all three platforms, then builds standalone executables with PyInstaller.
# - Every push / pull request: executables are attached to the workflow run as artifacts.
# - Pushing a tag like v0.2.0: the executables are also published as a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen  # run Qt without a display (tests and smoke tests)
  # Shared libraries Qt needs on Linux; desktops have these, CI runners don't.
  LINUX_QT_LIBS: >-
    libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
    libxcb-shape0 libxcb-xkb1 libxcb-util1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_QT_LIBS

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distros
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_QT_LIBS

      - name: Install
        run: python -m pip install . pyinstaller

      - name: Read version
        shell: bash
        run: |
          VERSION=$(python -c "import dww_launcher; print(dww_launcher.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=dww-launcher-$VERSION-${{ matrix.name }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ $VERSION"
            exit 1
          fi

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/dww-launcher.spec

      # Start each built executable headless to make sure it really runs.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/dww-launcher/dww-launcher --smoke-test

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: '"dist/DWW Launcher.app/Contents/MacOS/dww-launcher" --smoke-test'

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed (no console) exe must be waited on explicitly.
          $p = Start-Process -FilePath dist\dww-launcher\dww-launcher.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "$ARCHIVE.tar.gz" dww-launcher

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DWW Launcher.app" "$ARCHIVE.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\dww-launcher -DestinationPath "$env:ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
